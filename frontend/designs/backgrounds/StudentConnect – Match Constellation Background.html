<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>StudentConnect – Match Constellation Background</title>
<style>
:root{--bg1:#f4f6fe;--bg2:#e4e9fb;--glow:rgba(255,122,89,.14);--ink:#0e1530;--muted:#5a6384;--card:rgba(255,255,255,.72);--line:rgba(14,21,48,.1);--blue:#2f4bea;--coral:#ff7a59;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#0b1230;--bg2:#121b4a;--glow:rgba(255,122,89,.16);--ink:#f2f4ff;--muted:#a3abcf;--card:rgba(24,32,74,.62);--line:rgba(255,255,255,.12)}}
:root[data-theme="dark"]{--bg1:#0b1230;--bg2:#121b4a;--glow:rgba(255,122,89,.16);--ink:#f2f4ff;--muted:#a3abcf;--card:rgba(24,32,74,.62);--line:rgba(255,255,255,.12)}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:radial-gradient(60% 50% at 85% 0%,var(--glow),transparent 70%),radial-gradient(50% 50% at 0% 100%,rgba(47,75,234,.18),transparent 70%),linear-gradient(135deg,var(--bg1),var(--bg2));background-attachment:fixed}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
main{position:relative;z-index:1;min-height:100vh;display:grid;place-items:center;padding:24px}
.card{width:min(560px,100%);background:var(--card);border:1px solid var(--line);border-radius:22px;padding:24px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 20px 60px rgba(5,10,40,.25)}
.eyebrow{font-size:12px;letter-spacing:.12em;color:var(--coral);font-weight:700;text-transform:uppercase}
h1{margin:6px 0 4px;font-size:28px}
p{margin:0 0 16px;color:var(--muted);font-size:14px;line-height:1.5}
.row{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--line);border-radius:14px;margin-bottom:10px;background:rgba(127,140,200,.07)}
.logo{width:34px;height:34px;border-radius:10px;flex:none}
.row b{display:block;font-size:14px}.row span{font-size:12px;color:var(--muted)}
.score{margin-left:auto;font-weight:700;font-size:13px;padding:5px 10px;border-radius:999px;background:rgba(40,200,150,.18);color:#1fae82}
.ctrl{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:16px;font-size:12px;color:var(--muted)}
button{font:inherit;font-size:13px;font-weight:600;border:0;border-radius:999px;padding:9px 16px;cursor:pointer;background:var(--blue);color:#fff}
button.alt{background:transparent;color:var(--ink);border:1px solid var(--line)}
input[type=range]{accent-color:var(--coral);width:110px}
.hint{position:fixed;left:0;right:0;bottom:max(14px,env(safe-area-inset-bottom,0px));text-align:center;font-size:12px;color:var(--muted);z-index:1;pointer-events:none}
</style>
</head>
<body>
<canvas id="bg" aria-hidden="true"></canvas>
<main>
  <section class="card">
    <div class="eyebrow">Job matches</div>
    <h1>Find the roles that fit you</h1>
    <p>Your UI sits here, above the living background. Move the cursor to scan nearby openings.</p>
    <div class="row"><div class="logo" style="background:#ff7a59"></div><div><b>Android Developer</b><span>Northwind · Bengaluru</span></div><div class="score">92%</div></div>
    <div class="row"><div class="logo" style="background:#7c8cff"></div><div><b>ML Engineer, GenAI</b><span>Lumen Labs · Pune</span></div><div class="score">87%</div></div>
    <div class="ctrl">
      <button id="pulse">Send match pulse</button>
      <button id="theme" class="alt">Toggle theme</button>
      <label>Energy <input id="energy" type="range" min="0.3" max="2" step="0.1" value="1"></label>
    </div>
  </section>
</main>
<div class="hint">Move your cursor or tap anywhere · click sends a ripple of fresh matches</div>
<script>
const cv=document.getElementById('bg'),cx=cv.getContext('2d');
let W,H,D,nodes=[],ripples=[],mouse={x:0,y:0,on:false,last:0},energy=1,t=0;
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const isDark=()=>{const a=document.documentElement.dataset.theme;return a?a==='dark':matchMedia('(prefers-color-scheme: dark)').matches};
function init(){
  D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;
  cv.width=W*D;cv.height=H*D;cx.setTransform(D,0,0,D,0,0);
  const n=Math.max(36,Math.min(90,Math.round(W*H/17000)));
  nodes=Array.from({length:n},()=>({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.3,vy:(Math.random()-.5)*.3,s:55+Math.random()*43|0,r:3+Math.random()*3,f:0}));
}
function col(s,d){return s>=85?(d?'255,122,89':'235,95,60'):s>=70?(d?'124,140,255':'47,75,234'):(d?'120,215,185':'30,160,125')}
function pill(x,y,txt,d,a){
  cx.globalAlpha=a;cx.font='600 11px system-ui,sans-serif';const w=cx.measureText(txt).width+14;
  cx.fillStyle=d?'rgba(255,122,89,.92)':'rgba(47,75,234,.92)';
  cx.beginPath();cx.roundRect(x-w/2,y-26,w,18,9);cx.fill();
  cx.fillStyle='#fff';cx.textAlign='center';cx.fillText(txt,x,y-13);cx.globalAlpha=1;
}
function frame(){
  t++;const d=isDark(),sp=reduce?0.1:energy;
  cx.clearRect(0,0,W,H);
  let px=mouse.x,py=mouse.y,active=mouse.on;
  if(!active){px=W/2+Math.cos(t*.006)*W*.3;py=H/2+Math.sin(t*.009)*H*.25;active=true}
  const R=150+energy*35;
  for(const n of nodes){
    n.x+=n.vx*sp;n.y+=n.vy*sp;
    if(n.x<-10)n.x=W+10;if(n.x>W+10)n.x=-10;if(n.y<-10)n.y=H+10;if(n.y>H+10)n.y=-10;
    const dx=px-n.x,dy=py-n.y,dist=Math.hypot(dx,dy);n.d=dist;
    if(dist<R&&dist>1){n.x+=dx/dist*.35*(1-dist/R)*sp;n.y+=dy/dist*.35*(1-dist/R)*sp}
    n.f=Math.max(0,n.f-.015);
  }
  for(const r of ripples){r.r+=6*sp+2;r.a=1-r.r/320;
    for(const n of nodes){if(Math.abs(Math.hypot(n.x-r.x,n.y-r.y)-r.r)<12)n.f=1}}
  ripples=ripples.filter(r=>r.r<320);
  // node to node links
  for(let i=0;i<nodes.length;i++)for(let j=i+1;j<nodes.length;j++){
    const a=nodes[i],b=nodes[j],dd=Math.hypot(a.x-b.x,a.y-b.y);
    if(dd<125){cx.strokeStyle=d?`rgba(150,165,255,${(1-dd/125)*.16})`:`rgba(47,75,234,${(1-dd/125)*.14})`;cx.lineWidth=1;cx.beginPath();cx.moveTo(a.x,a.y);cx.lineTo(b.x,b.y);cx.stroke()}
  }
  // ripples
  for(const r of ripples){cx.strokeStyle=`rgba(255,122,89,${r.a*.5})`;cx.lineWidth=2;cx.beginPath();cx.arc(r.x,r.y,r.r,0,6.283);cx.stroke()}
  // scanner links
  const near=nodes.filter(n=>n.d<R).sort((a,b)=>a.d-b.d);
  for(const n of near){const k=1-n.d/R;cx.strokeStyle=`rgba(255,122,89,${k*.5})`;cx.lineWidth=1.2;cx.beginPath();cx.moveTo(px,py);cx.lineTo(n.x,n.y);cx.stroke()}
  // nodes
  for(const n of nodes){
    const c=col(n.s,d),boost=Math.max(n.f,n.d<R?1-n.d/R:0),rr=n.r*(1+boost*.7);
    if(n.s>=85||boost>.2){const g=cx.createRadialGradient(n.x,n.y,0,n.x,n.y,rr*5);g.addColorStop(0,`rgba(${c},${.28+boost*.3})`);g.addColorStop(1,`rgba(${c},0)`);cx.fillStyle=g;cx.beginPath();cx.arc(n.x,n.y,rr*5,0,6.283);cx.fill()}
    cx.fillStyle=`rgba(${c},${.5+boost*.5})`;cx.beginPath();cx.roundRect(n.x-rr,n.y-rr,rr*2,rr*2,rr*.6);cx.fill();
  }
  // scanner ring + labels
  cx.save();cx.strokeStyle=d?'rgba(255,255,255,.14)':'rgba(14,21,48,.14)';cx.setLineDash([4,8]);cx.lineDashOffset=-t*.4;cx.beginPath();cx.arc(px,py,R,0,6.283);cx.stroke();cx.restore();
  // stable labels: sticky, spaced apart, fade in/out (no per-frame re-ranking)
  for(const n of nodes){if(n.lab&&(n.d>R*.9||t-n.lt>240)){n.lab=false;n.cool=t+150}}
  let cnt=nodes.filter(n=>n.lab).length;
  if(t%15===0)for(const n of near){
    if(cnt>=3)break;
    if(n.lab||n.d>R*.65||(n.cool||0)>t)continue;
    if(nodes.some(m=>m.lab&&Math.hypot(m.x-n.x,m.y-n.y)<80))continue;
    n.lab=true;n.lt=t;cnt++;
  }
  for(const n of nodes){n.la=(n.la||0)+((n.lab?1:0)-(n.la||0))*.1;if(n.la>.02)pill(n.x,n.y-n.r-4,n.s+'% match',d,n.la)}
  requestAnimationFrame(frame);
}
addEventListener('pointermove',e=>{mouse.x=e.clientX;mouse.y=e.clientY;mouse.on=true;mouse.last=performance.now()});
addEventListener('pointerdown',e=>{mouse.x=e.clientX;mouse.y=e.clientY;mouse.on=true;ripples.push({x:e.clientX,y:e.clientY,r:0,a:1})});
addEventListener('pointerup',e=>{if(e.pointerType!=='mouse')setTimeout(()=>mouse.on=false,1200)});
document.addEventListener('pointerleave',()=>mouse.on=false);
document.getElementById('pulse').onclick=()=>ripples.push({x:W/2,y:H/2,r:0,a:1});
document.getElementById('energy').oninput=e=>energy=+e.target.value;
document.getElementById('theme').onclick=()=>{document.documentElement.dataset.theme=isDark()?'light':'dark'};
addEventListener('resize',init);
init();frame();
</script>
</body>
</html>
