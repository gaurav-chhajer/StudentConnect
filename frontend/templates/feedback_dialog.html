<dialog id="feedback-dialog" aria-labelledby="quick-feedback-title"><div class="dialog-heading"><h2 id="quick-feedback-title">Tell us how it went</h2><button class="btn ghost" type="button" data-close-dialog>Close</button></div>
<form method="post" action="{{ url_for('feedback.submit') }}" class="page-form"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><p class="sub">Feedback is shared with the Jobspresso owner.</p>
<label>Score accuracy<select name="accuracy" required><option value="">Choose 1 to 5</option>{% for n in range(1,6) %}<option>{{ n }}</option>{% endfor %}</select></label>
<label>Ease of use<select name="ease" required><option value="">Choose 1 to 5</option>{% for n in range(1,6) %}<option>{{ n }}</option>{% endfor %}</select></label>
<label>What went wrong?<textarea name="issues" rows="2" maxlength="2000"></textarea></label><label>What would help?<textarea name="feature_request" rows="2" maxlength="2000"></textarea></label>
<label>Would you use this for real applications?<select name="would_use" required><option value="">Choose one</option><option value="yes">Yes</option><option value="maybe">Maybe</option><option value="no">No</option></select></label><button class="btn">Send feedback</button></form></dialog>
