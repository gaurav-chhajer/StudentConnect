name: Approved inactive release cleanup

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: studentconnect-daily-automation
  cancel-in-progress: false

jobs:
  inspect:
    if: github.ref == 'refs/heads/hosting-approved-cleanup'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548
        with:
          python-version: '3.12'
      - name: Install project dependencies
        run: python -m pip install -r requirements.txt
      - name: Test read-only inspection
        run: python -B -m unittest tests.test_hosting_storage_inspection tests.test_approved_hosting_cleanup
      - name: Delete only the explicitly approved inactive releases
        env:
          PYTHONANYWHERE_API_TOKEN: ${{ secrets.PYTHONANYWHERE_API_TOKEN }}
        run: python -B -m scripts.prune_approved_hosted_releases --plan scripts/approved_release_cleanup.json --confirm-sha256 1ad8596444fb210c2c3424427cd1a54c3acba4a443f16c96b470551e89f0cb1f
